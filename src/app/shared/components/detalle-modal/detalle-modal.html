@if (modal()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" (click)="openBox()">
  <div class="relative w-full max-w-2xl mx-4 rounded-2xl shadow-2xl border
           bg-white dark:bg-gray-900 dark:border-gray-700
           animate-scale-up transition-all duration-300" (click)="$event.stopPropagation()">

    <button class="absolute top-4 right-4 px-2 py-1 rounded-full
             bg-gray-100 dark:bg-gray-800
             hover:bg-red-500 hover:text-white
             transition-all duration-300 hover:scale-110" (click)="openBox()">
      ✕
    </button>

    <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-xl font-semibold text-gray-800 dark:text-white">
        {{ title() }}
      </h2>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        {{ description() }}
      </p>
      @if (error()) {
      <span class="text-red-200 text-sm bg-red-600 block">
        {{ error() }}
      </span>
      }
    </div>

    <div class="p-6 space-y-4 text-sm">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        @for (item of campos(); track $index) {
        <div class="space-y-1">
          <span class="text-gray-500 dark:text-gray-400">{{ item.label }}</span>
          @if(item.isArray){
          @for(element of item.items; track $index){
          <p class="font-medium text-gray-800 dark:text-white">
            {{ element }}
          </p>
          }
          } @else {
          <p class="font-medium text-gray-800 dark:text-white">
            {{ item.value }}
          </p>
          }
        </div>
        }
      </div>
    </div>

    <ng-content select="[footer]"></ng-content>

  </div>
</div>
}
