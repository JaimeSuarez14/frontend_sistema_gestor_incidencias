@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" (click)="toogleModal()">
  <div class="relative w-full max-w-2xl mx-4 rounded-2xl shadow-2xl border
           bg-white dark:bg-gray-900 dark:border-gray-700 p-6
           animate-scale-up transition-all duration-300" (click)="$event.stopPropagation()">

    <!-- ❌ Botón cerrar -->
    <button class="absolute top-4 right-4 px-2 py-1 rounded-full
             bg-gray-100 dark:bg-gray-800
             hover:bg-red-500 hover:text-white
             transition-all duration-300 hover:scale-110" (click)="toogleModal()">
      ✕
    </button>
    <ng-content></ng-content>
  </div>
</div>
}
