@if (modal()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" (click)="openBox()">
  <div class="relative w-full max-w-2xl mx-4 rounded-2xl shadow-2xl border
           bg-white dark:bg-gray-900 dark:border-gray-700
           animate-scale-up transition-all duration-300" (click)="$event.stopPropagation()">

    <!-- ❌ Botón cerrar -->
    <button class="absolute top-4 right-4 px-2 py-1 rounded-full
             bg-gray-100 dark:bg-gray-800
             hover:bg-red-500 hover:text-white
             transition-all duration-300 hover:scale-110" (click)="openBox()">
      ✕
    </button>

    <!-- 🧾 Header -->
    <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
      <h2 class="text-xl font-semibold text-gray-800 dark:text-white">
        📄 Detalle de la Incidencia
      </h2>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Información completa del registro seleccionado
      </p>
      @if (error()) {
      <span class="text-red-200 text-sm bg-red-600" style="display: block">
        {{ error() }}
      </span>
      }
    </div>

    <!-- 📊 Contenido -->
    <div class="p-6 space-y-4 text-sm">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">



        <div class="space-y-1">
          <span class="text-gray-500 dark:text-gray-400">Prioridad</span>
          <p class="font-medium text-gray-800 dark:text-white">
            vacio </p>
        </div>

        <div class="space-y-1">
          <span class="text-gray-500 dark:text-gray-400">Fecha</span>
          <p class="font-medium text-gray-800 dark:text-white">
            vacio
          </p>
        </div>

        <div class="space-y-1">
          <span class="text-gray-500 dark:text-gray-400">Técnico</span>
          <p class="font-medium text-gray-800 dark:text-white">
            nombre de tecnico
          </p>
        </div>
        @for (item of campos(); track $index) {
        <div class="space-y-1">
          <span class="text-gray-500 dark:text-gray-400">Usuario</span>
          <p class="font-medium text-gray-800 dark:text-white">
            {{ item }}
          </p>
        </div>
        }
      </div>

    </div>

    <!-- 🔘 Footer -->
    <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 flex justify-end">
      <a routerLink="/incidencia/seguimiento" class="px-5 py-2 rounded-lg text-sm font-medium
               bg-blue-600 text-white
               hover:bg-blue-700 hover:scale-105
               transition-all duration-300">
        Ver seguimiento →
      </a>
    </div>

  </div>
</div>
}
